name: Design preview

# Publishes the Execution 07 design preview to GitHub Pages on every push to the
# web design branch, so the owner gets a stable HTTPS link instead of a
# temporary sandbox URL. The site is generated from files already committed to
# the branch, so the preview can never show something the repository does not
# contain.
#
# The Pages site is served from the `gh-pages` branch, which holds generated
# output only and must never be edited by hand. That branch is force-updated on
# every run; no other branch is touched.
#
# No repository secret is required: the workflow uses the token GitHub issues to
# the run itself, and the build reads only committed assets.
on:
  push:
    branches: [feature/execution-07-premium-web]
  # Allow a manual republish, for example after a transient deployment failure.
  workflow_dispatch:

# One deployment at a time. A newer push supersedes an in-flight build, but an
# in-flight deployment is never cancelled, so the published site is never left
# half-written.
concurrency:
  group: design-preview
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '9.15.9'
  # The stable Pages URL for this repository. Kept explicit so the job summary
  # cannot drift from the configured site.
  PREVIEW_URL: https://mohammadaljallad079-rgb.github.io/oryx/

jobs:
  # ---------------------------------------------------------------- build
  build:
    name: Build the static preview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the preview site
        run: pnpm preview:build
        env:
          PREVIEW_BRANCH: ${{ github.ref_name }}
          PREVIEW_SHA: ${{ github.sha }}

      - name: Report what was built
        run: |
          echo "Pages: $(find build/preview -name '*.html' | wc -l)"
          echo "Images: $(find build/preview/assets -type f | wc -l)"
          echo "Size: $(du -sh build/preview | cut -f1)"

      - name: Upload the preview site
        uses: actions/upload-artifact@v4
        with:
          name: preview-site
          path: build/preview/
          retention-days: 14

  # --------------------------------------------------------------- verify
  # Proves the built site actually renders before it is published: every page
  # loads, every image resolves, no console error, and no horizontal overflow at
  # a desktop and a mobile viewport.
  verify:
    name: Verify the built site
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download the preview site
        uses: actions/download-artifact@v4
        with:
          name: preview-site
          path: build/preview

      - name: Install the Playwright browser
        run: pnpm --filter @oryx/admin exec playwright install --with-deps chromium

      - name: Serve the site
        run: |
          node scripts/preview/serve-preview.mjs 8099 > /tmp/preview-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:8099/; then echo "ready after ${i}s"; exit 0; fi
            sleep 1
          done
          echo "preview server failed to start"; cat /tmp/preview-server.log; exit 1

      - name: Render check
        run: pnpm preview:verify
        env:
          PREVIEW_BASE: http://127.0.0.1:8099

      - name: Link and dark-theme crawl
        run: pnpm preview:check
        env:
          PREVIEW_BASE: http://127.0.0.1:8099

  # --------------------------------------------------------------- deploy
  # This job deliberately does not declare the `github-pages` environment. That
  # environment is restricted to the `gh-pages` branch, so a job running on the
  # design branch is held by the branch policy and fails. The environment adds
  # nothing here: publishing is a plain force-push to `gh-pages`.
  deploy:
    name: Publish to GitHub Pages
    runs-on: ubuntu-latest
    needs: [build, verify]
    permissions:
      contents: write
    steps:
      - name: Download the preview site
        uses: actions/download-artifact@v4
        with:
          name: preview-site
          path: build/preview

      # The published branch is generated output. It is replaced on every run,
      # so its history carries no meaning and a force-push is the intended
      # behaviour. Nothing outside this branch is written.
      - name: Publish the built site to the gh-pages branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd build/preview
          git init -q -b gh-pages
          git config user.name 'oryx-preview'
          git config user.email 'oryx-preview@users.noreply.github.com'
          git add -A
          git commit -q -m "Publish the design preview from ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -q -f origin gh-pages

      - name: Wait for the published site
        run: |
          for i in $(seq 1 40); do
            if curl -fsS -o /dev/null "${PREVIEW_URL}"; then
              echo "published after ${i} attempt(s)"; exit 0
            fi
            sleep 15
          done
          echo "the published site did not become reachable"; exit 1

      - name: Report the published URL
        run: |
          {
            echo "### Design preview published"
            echo ""
            echo "${PREVIEW_URL}"
            echo ""
            echo "Built from \`${GITHUB_SHA}\` on \`${GITHUB_REF_NAME}\`."
          } >> "$GITHUB_STEP_SUMMARY"
