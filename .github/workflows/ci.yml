name: CI

# Runs on every pull request targeting main and on pushes to main and to the
# active feature branch. All credentials used here are throwaway test values
# generated inside the workflow; no repository secret is required, so the
# workflow is safe for fork pull requests.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/execution-01-super-admin-foundation, feature/execution-02-erp-core]
  workflow_dispatch:

# Cancel superseded runs on the same ref to conserve CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: the workflow only reads the repository.
permissions:
  contents: read

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '9.15.9'

jobs:
  # ---------------------------------------------------------------- quality
  quality:
    name: Typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @oryx/database exec prisma generate

      # The apps resolve @oryx/shared and @oryx/database from their compiled
      # dist, so the packages must be built before anything typechecks them.
      - name: Build workspace packages
        run: |
          pnpm --filter @oryx/shared build
          pnpm --filter @oryx/database build

      - name: Typecheck API
        run: pnpm --filter @oryx/api typecheck

      - name: Typecheck admin app
        run: pnpm --filter @oryx/admin typecheck

      - name: Build API
        run: pnpm --filter @oryx/api build

      - name: Build admin app
        run: pnpm --filter @oryx/admin build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:3001/api

  # ------------------------------------------------------- unit + API suites
  test-api:
    name: Unit and API integration tests
    runs-on: ubuntu-latest
    needs: quality

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: oryx_test
          POSTGRES_PASSWORD: oryx_test_password
          POSTGRES_DB: oryx_test
        ports:
          - 5432:5432
        # Wait for the database to accept connections before the job starts.
        options: >-
          --health-cmd "pg_isready -U oryx_test -d oryx_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://oryx_test:oryx_test_password@127.0.0.1:5432/oryx_test?schema=public
      # Throwaway values for this job only. They are never reused anywhere.
      JWT_ACCESS_SECRET: ci-access-secret-not-used-outside-ci-0000000000
      JWT_REFRESH_SECRET: ci-refresh-secret-not-used-outside-ci-000000000
      MFA_ENCRYPTION_KEY: ci-mfa-encryption-key-not-used-outside-ci-0000000
      MFA_ISSUER: ORYX CI
      CORS_ORIGINS: http://localhost:3000
      SEED_SUPER_ADMIN_EMAIL: superadmin@oryx.local
      SEED_SUPER_ADMIN_PASSWORD: CiTestPassword!2026
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @oryx/database exec prisma generate

      - name: Build workspace packages
        run: |
          pnpm --filter @oryx/shared build
          pnpm --filter @oryx/database build

      - name: Apply database migrations
        run: pnpm --filter @oryx/database exec prisma migrate deploy

      - name: Seed the baseline catalog and test fixtures
        run: pnpm db:seed

      - name: Verify the schema is in sync with the migrations
        run: pnpm --filter @oryx/database exec prisma migrate status

      - name: Run authorization unit tests
        run: pnpm --filter @oryx/shared test

      - name: Run API integration tests
        run: pnpm --filter @oryx/api test:e2e

      - name: Upload API test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-results
          path: |
            apps/api/test-results/
            apps/api/coverage/
          if-no-files-found: ignore
          retention-days: 14

  # ------------------------------------------------------------- UI suites
  test-ui:
    name: Browser acceptance tests
    runs-on: ubuntu-latest
    needs: quality

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: oryx_test
          POSTGRES_PASSWORD: oryx_test_password
          POSTGRES_DB: oryx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oryx_test -d oryx_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://oryx_test:oryx_test_password@127.0.0.1:5432/oryx_test?schema=public
      JWT_ACCESS_SECRET: ci-access-secret-not-used-outside-ci-0000000000
      JWT_REFRESH_SECRET: ci-refresh-secret-not-used-outside-ci-000000000
      MFA_ENCRYPTION_KEY: ci-mfa-encryption-key-not-used-outside-ci-0000000
      MFA_ISSUER: ORYX CI
      CORS_ORIGINS: http://localhost:3000
      SEED_SUPER_ADMIN_EMAIL: superadmin@oryx.local
      SEED_SUPER_ADMIN_PASSWORD: CiTestPassword!2026
      NODE_ENV: test
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3001/api
      NEXT_PUBLIC_DEFAULT_LOCALE: ar
      NEXT_PUBLIC_DEFAULT_THEME: dark
      # The suites sign in many times; raise the ceilings so the limiter does not
      # mask real failures. A dedicated suite still asserts HTTP 429.
      AUTH_THROTTLE_LIMIT: '100000'
      THROTTLE_LIMIT: '1000000'
      REFRESH_THROTTLE_LIMIT: '100000'
      API_PORT: '3001'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @oryx/database exec prisma generate

      - name: Build workspace packages
        run: |
          pnpm --filter @oryx/shared build
          pnpm --filter @oryx/database build

      - name: Apply database migrations
        run: pnpm --filter @oryx/database exec prisma migrate deploy

      - name: Seed the baseline catalog and test fixtures
        run: pnpm db:seed

      - name: Build the API
        run: pnpm --filter @oryx/api build

      - name: Build the admin app
        run: pnpm --filter @oryx/admin build

      - name: Install Playwright browsers
        run: pnpm --filter @oryx/admin exec playwright install --with-deps chromium

      # Start the API, then poll its health endpoint so the browser suites never
      # race a half-started server.
      - name: Start the API
        run: |
          node apps/api/dist/main.js > /tmp/oryx-api.log 2>&1 &
          echo $! > /tmp/oryx-api.pid
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3001/api/health | grep -q '"database":"up"'; then
              echo "API is ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "API failed to become ready"; tail -50 /tmp/oryx-api.log; exit 1

      # Start the admin app and wait for the login page to render.
      - name: Start the admin app
        run: |
          (cd apps/admin && pnpm start > /tmp/oryx-admin.log 2>&1 &)
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null http://localhost:3000/login; then
              echo "Admin app is ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Admin app failed to become ready"; tail -50 /tmp/oryx-admin.log; exit 1

      - name: Run browser acceptance, MFA, responsive and functional suites
        run: pnpm --filter @oryx/admin test:ui
        env:
          ORYX_ADMIN_URL: http://localhost:3000
          ORYX_API: http://localhost:3001/api/v1

      - name: Show server logs on failure
        if: failure()
        run: |
          echo '--- API log ---'; tail -100 /tmp/oryx-api.log || true
          echo '--- Admin log ---'; tail -100 /tmp/oryx-admin.log || true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/admin/playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload failure screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures
          path: apps/admin/test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload captured screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oryx-screenshots
          path: docs/execution-reports/screenshots/
          if-no-files-found: ignore
          retention-days: 14
