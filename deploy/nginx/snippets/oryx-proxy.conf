# Proxy behaviour shared by every proxied location.
#
# `X-Forwarded-Proto https` is hard-coded because every proxied location sits
# behind a TLS server block; the API builds the refresh cookie's `Secure` flag
# and the CORS origin from this header.

proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header Upgrade           $http_upgrade;
proxy_set_header Connection        $oryx_connection_upgrade;
proxy_read_timeout 120s;
proxy_send_timeout 120s;
proxy_connect_timeout 10s;
proxy_buffering on;
