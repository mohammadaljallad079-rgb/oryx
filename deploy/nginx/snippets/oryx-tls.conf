# TLS parameters shared by both HTTPS server blocks.
#
# Certificate *paths* are declared per server block, not here, because nginx
# cannot vary an `ssl_certificate` path by `$host` and each host has its own
# certificate. This snippet holds only the parameters that are genuinely common.

ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

ssl_session_cache shared:oryx-ssl:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

# OCSP stapling. `ssl_trusted_certificate` is the chain file, which certbot
# writes alongside the certificate.
ssl_stapling on;
ssl_stapling_verify on;
resolver 1.1.1.1 8.8.8.8 valid=300s;
resolver_timeout 5s;

add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
