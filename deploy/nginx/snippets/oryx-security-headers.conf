# Security response headers.
#
# The CSP is deliberately not set here. Next.js inlines bootstrap scripts and
# the admin app uses inline styles, so a correct policy needs per-app nonce
# support rather than a static header. Shipping a policy that is either broken
# or misleading would be worse than shipping none; the other headers below are
# unconditional and safe. See docs/DEPLOYMENT.md §5.3.

add_header X-Content-Type-Options  "nosniff" always;
add_header X-Frame-Options         "DENY" always;
add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
add_header Permissions-Policy      "camera=(), microphone=(), geolocation=(self)" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
