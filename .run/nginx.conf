# ORYX staging preview reverse proxy.
#
# The platform ingress terminates TLS for the public *.all-hands.dev hosts and
# forwards plain HTTP to ports 12000 (work-1) and 12001 (work-2). Each block
# serves one Next.js app at the origin root and proxies /api to the NestJS API,
# so the browser sees a single same-origin API and the HttpOnly refresh cookie
# and CSRF double-submit both work without CORS.

worker_processes auto;
pid /workspace/project/oryx/.run/nginx.pid;
error_log /workspace/project/oryx/.run/nginx-error.log warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /workspace/project/oryx/.run/nginx-access.log;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 25m;

    # All temp paths live under the workspace so the unprivileged user can
    # create them without touching /var/lib/nginx.
    client_body_temp_path /workspace/project/oryx/.run/nginx-tmp/body;
    proxy_temp_path       /workspace/project/oryx/.run/nginx-tmp/proxy;
    fastcgi_temp_path     /workspace/project/oryx/.run/nginx-tmp/fastcgi;
    uwsgi_temp_path       /workspace/project/oryx/.run/nginx-tmp/uwsgi;
    scgi_temp_path        /workspace/project/oryx/.run/nginx-tmp/scgi;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";
    proxy_read_timeout 120s;

    # ---- work-1: admin / control plane (Super Admin + all ERP modules) ----
    server {
        listen 12000;
        server_name _;

        location /api/ {
            proxy_pass http://127.0.0.1:3001;
        }

        # Audit evidence (screenshots, renders). Static files served straight
        # from disk so a fresh capture is visible without rebuilding Next.js,
        # whose `public/` directory is snapshotted at boot.
        location /evidence/ {
            alias /workspace/project/oryx/.run/evidence/;
            autoindex on;
        }

        location / {
            proxy_pass http://127.0.0.1:3000;
        }
    }

    # ---- work-2: customer website, customer dashboard and mobile web ----
    server {
        listen 12001;
        server_name _;

        location /api/ {
            proxy_pass http://127.0.0.1:3001;
        }

        # No trailing slash: the mobile export is built with
        # `experiments.baseUrl = '/mobile'`, so its asset URLs already carry the
        # prefix and the static server expects to receive `/mobile/...`.
        location /mobile/ {
            proxy_pass http://127.0.0.1:8081;
        }

        location / {
            proxy_pass http://127.0.0.1:3002;
        }
    }
}
