<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Light theme contact sheet</title>
<style>
  body { margin: 0; background: #202020; font: 13px/1.4 system-ui, sans-serif; color: #eee; }
  h1 { margin: 16px; font-size: 18px; }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; padding: 16px; }
  figure { margin: 0; background: #2a2a2a; border-radius: 10px; overflow: hidden; }
  figcaption { padding: 8px 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; font-size: 11px; color: #bbb; }
  img { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
<h1>Execution 07 — light theme, English LTR, 1280×900</h1>
<div class="grid" id="g"></div>
<script>
  const names = ['home','providers','dashboard','login','profile','services','support'];
  const g = document.getElementById('g');
  for (const n of names) {
    const f = document.createElement('figure');
    f.innerHTML = `<figcaption>${n}</figcaption><img src="./en-${n}-light.png" alt="${n}">`;
    g.appendChild(f);
  }
</script>
</body>
</html>
